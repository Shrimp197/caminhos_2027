<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caminho do Centenário</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#0e4e37;--green2:#166b4b;--cream:#eff5ef;--card:#fff;--route:#f0c419;--blue:#2474db;--danger:#c94136;--text:#173126;--muted:#64766c}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--text);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}.top{height:78px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}.brand{display:flex;gap:10px;align-items:center}.boot{font-size:30px}.brand b{display:block;font-size:18px}.brand small{display:block;font-size:12px;opacity:.82}.mode{border:1px solid #ffffff55;border-radius:28px;padding:10px 14px;font-weight:750;font-size:13px}
.main{position:relative;flex:1;min-height:0}.map{position:absolute;inset:0}.maprot{position:absolute;inset:0;transform-origin:50% 50%;pointer-events:none}.maprot #map{pointer-events:auto}
.leaflet-container{background:#e9f1ea}.leaflet-control-attribution{font-size:9px}
.fabbar{position:absolute;right:14px;top:16px;display:flex;flex-direction:column;gap:12px;z-index:1200}.fab{width:54px;height:54px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 16px #0002;font-size:23px;color:var(--green)}.fab.active{background:var(--green);color:#fff}
.menu{position:absolute;left:14px;top:16px;z-index:1200}.menu button{width:54px;height:54px;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 16px #0002;font-size:24px;color:var(--green)}
.drawer{position:absolute;left:14px;right:14px;top:78px;z-index:1300;background:#fff;border-radius:16px;box-shadow:0 8px 30px #0003;max-height:45vh;overflow:auto;padding:14px;display:none}.drawer.open{display:block}.support{padding:9px 0;border-bottom:1px solid #edf0ee}.support b{display:block}.support small{color:var(--muted)}.tag{display:inline-block;margin-top:3px;padding:3px 6px;border-radius:9px;background:#eef5ef;color:var(--green);font-size:11px}
.panel{position:absolute;left:14px;right:14px;bottom:14px;z-index:1100;background:#fff;border-radius:20px;box-shadow:0 8px 30px #0002;padding:12px}
.row{display:flex;gap:10px;align-items:stretch}.status{flex:1;min-width:0;background:#eef7ef;border-radius:14px;padding:11px 13px}.status.warn{background:#fff0ed;color:#7f241f}.status b{display:block;font-size:17px}.status small{display:block;margin-top:2px;color:var(--muted)}.btn{border:0;border-radius:14px;background:var(--green2);color:#fff;font-weight:800;padding:10px 16px;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.stat{background:#f5f7f5;border-radius:12px;padding:9px}.stat b{font-size:21px;display:block}.stat small{color:var(--muted)}
.next{border:1px solid #dce6df;border-radius:13px;padding:10px 12px;margin-top:8px}.next .label{font-size:10px;letter-spacing:.08em;color:var(--muted)}.next b{display:block;font-size:16px;margin:2px 0}.next small{color:var(--muted)}
.stage{margin-top:8px;border-top:1px solid #edf0ee;padding-top:8px}.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stage select{width:100%;padding:8px;border-radius:10px;border:1px solid #d8e0da;background:#fff}.stage small{color:var(--muted)}
@media(max-width:480px){.top{height:72px;padding:8px 12px}.mode{padding:8px 10px}.panel{left:8px;right:8px;bottom:8px}.fabbar{right:8px}.menu{left:8px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="boot">🥾</span><div><b>Caminho do Centenário</b><small>Gaia → Fátima</small></div></div>
  <div class="mode">MODO CAMINHAR</div>
</header>
<main class="main">
  <div id="mapRot" class="maprot"><div id="map" class="map"></div></div>
  <div class="menu"><button id="menuBtn" aria-label="Apoios">☰</button></div>
  <div class="fabbar">
    <button id="followBtn" class="fab" title="Centrar posição">⌖</button>
    <button id="rotateBtn" class="fab" title="Seguir direção">🧭</button>
    <button id="gpsBtn" class="fab" title="GPS">📍</button>
  </div>
  <div id="drawer" class="drawer">
    <b>⛺ Apoios no percurso</b>
    <div id="supportList"></div>
  </div>
  <section class="panel">
    <div class="row">
      <div id="status" class="status"><b>GPS desligado</b><small>Ativa o GPS para acompanhar o percurso.</small></div>
      <button id="startBtn" class="btn">▶ Iniciar</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="kmDone">0,0</b><small>km no percurso</small></div>
      <div class="stat"><b id="kmLeft">216,1</b><small>km até Fátima</small></div>
      <div class="stat"><b id="offRoute">—</b><small>distância ao traçado</small></div>
    </div>
    <div class="next"><div class="label">PRÓXIMO APOIO</div><b id="nextName">—</b><small id="nextInfo">Inicia a caminhada.</small></div>
    <div class="stage">
      <div class="label" style="font-size:10px;letter-spacing:.08em;color:#64766c">ETAPA / TRECHO</div>
      <div class="stage-grid">
        <select id="stageStart"></select><select id="stageEnd"></select>
      </div>
      <small id="stageInfo">Seleciona início e fim.</small>
    </div>
  </section>
</main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const ROUTE='data/route.geojson';
const SUPPORTS='data/apoios-2026.json';
let map=null, routeCoords=[], supportItems=[], markers=[];
let userMarker=null, accCircle=null, watchId=null, following=false, rotateMode=false;
let totalKm=216.1, currentKm=0, simKm=0;

function fmt(n){return Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1});}
function speak(text){
  try{
    if(window.Android && typeof Android.speak==='function'){Android.speak(String(text));}
    else if('speechSynthesis' in window){window.speechSynthesis.cancel();window.speechSynthesis.speak(new SpeechSynthesisUtterance(String(text)));}
  }catch(e){}
}
function hav(a,b){
  const R=6371000;
  const p1=a[1]*Math.PI/180, p2=b[1]*Math.PI/180;
  const dp=(b[1]-a[1])*Math.PI/180, dl=(b[0]-a[0])*Math.PI/180;
  const h=Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(Math.max(0,Math.min(1,h))));
}
function bearing(a,b){
  const p1=a[1]*Math.PI/180, p2=b[1]*Math.PI/180, dl=(b[0]-a[0])*Math.PI/180;
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function pointSegDistance(p,a,b){
  const lat=p[1]*Math.PI/180, k=111320, c=Math.cos(lat);
  const ax=a[0]*k*c, ay=a[1]*k, bx=b[0]*k*c, by=b[1]*k, px=p[0]*k*c, py=p[1]*k;
  const dx=bx-ax, dy=by-ay;
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));
  const qx=ax+t*dx, qy=ay+t*dy;
  return {d:Math.hypot(px-qx,py-qy),t,q:[qx/(k*c),qy/k]};
}
function nearest(p){
  let best={d:Infinity,km:0,heading:0}, km=0;
  for(const line of routeCoords){
    for(let i=1;i<line.length;i++){
      const a=line[i-1], b=line[i], r=pointSegDistance(p,a,b), len=hav(a,b)/1000;
      if(r.d<best.d) best={d:r.d,km:km+len*r.t,heading:bearing(a,b)};
      km+=len;
    }
  }
  return best;
}
function pointAtKm(target){
  let km=0;
  for(const line of routeCoords){
    for(let i=1;i<line.length;i++){
      const d=hav(line[i-1],line[i])/1000;
      if(km+d>=target){
        const t=(target-km)/(d||1), a=line[i-1], b=line[i];
        return [a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1])];
      }
      km+=d;
    }
  }
  const last=routeCoords[routeCoords.length-1];
  return last[last.length-1];
}
function markerIcon(kind){
  const bg=kind==='gratuito' ? '#166b4b' : '#2474db';
  const symbol=kind==='gratuito' ? '⛺' : 'ℹ️';
  return L.divIcon({className:'',html:'<div style="width:28px;height:28px;border-radius:50%;background:'+bg+';border:3px solid #fff;box-shadow:0 2px 7px #0005;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px">'+symbol+'</div>',iconSize:[28,28],iconAnchor:[14,14]});
}
function renderSupports(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  supportItems.forEach(s=>{
    const m=L.marker([s.lat,s.lon],{icon:markerIcon(s.category)})
      .addTo(map)
      .bindPopup('<b>'+s.name+'</b><br>'+s.municipality+'<br><br>'+s.description+'<br><small>Km '+fmt(s.km)+'</small>');
    markers.push(m);
  });
  const list=document.getElementById('supportList');
  list.innerHTML='';
  supportItems.slice().sort((a,b)=>a.km-b.km).forEach(s=>{
    const d=document.createElement('div');
    d.className='support';
    d.innerHTML='<b>'+s.name+'</b><small>'+s.municipality+' · km '+fmt(s.km)+'</small><br><span class="tag">'+s.description+'</span>';
    d.addEventListener('click',()=>{map.setView([s.lat,s.lon],16);});
    list.appendChild(d);
  });
}
function updateStageOptions(){
  const places=[
    ['Porto',0],['São João da Madeira',32.1],['Cucujães',36],['Oliveira de Azeméis',41],
    ['Albergaria-a-Velha',56],['Águeda',74],['Anadia',91],['Mealhada',98.7],
    ['Coimbra',126.3],['Condeixa-a-Nova',145],['Soure',160],['Pombal',188.2],
    ['Leiria',201],['Ourém',214.8],['Fátima',216.1]
  ];
  const a=document.getElementById('stageStart'), b=document.getElementById('stageEnd');
  a.innerHTML=''; b.innerHTML='';
  places.forEach(p=>{
    const o1=document.createElement('option');o1.value=p[1];o1.textContent=p[0]+' · km '+fmt(p[1]);a.appendChild(o1);
    const o2=document.createElement('option');o2.value=p[1];o2.textContent=p[0]+' · km '+fmt(p[1]);b.appendChild(o2);
  });
  b.selectedIndex=1;
  function change(){
    const start=Number(a.value), end=Number(b.value);
    document.getElementById('stageInfo').textContent = end>start ? 'Trecho selecionado: '+fmt(end-start)+' km' : 'O fim tem de estar depois do início.';
  }
  a.addEventListener('change',change);b.addEventListener('change',change);change();
}
function updateRotation(heading){
  if(!rotateMode)return;
  document.getElementById('mapRot').style.transform='rotate('+(-heading)+'deg)';
}
function updatePosition(lat,lon,accuracy,course){
  if(!userMarker){
    userMarker=L.marker([lat,lon],{zIndexOffset:1000,icon:L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:#2474db;border:4px solid #fff;box-shadow:0 2px 8px #0004"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);
  }else userMarker.setLatLng([lat,lon]);
  if(!accCircle)accCircle=L.circle([lat,lon],{radius:accuracy||20,fillOpacity:.08,weight:1}).addTo(map);
  else accCircle.setLatLng([lat,lon]).setRadius(accuracy||20);

  const n=nearest([lon,lat]);
  currentKm=Math.max(0,Math.min(totalKm,n.km));
  document.getElementById('kmDone').textContent=fmt(currentKm);
  document.getElementById('kmLeft').textContent=fmt(totalKm-currentKm);
  document.getElementById('offRoute').textContent=fmt(n.d/1000)+' km';

  const st=document.getElementById('status');
  if(n.d<60){
    st.className='status';st.innerHTML='<b>✓ No percurso</b><small>'+Math.round(n.d)+' m do traçado</small>';
  }else{
    st.className='status warn';st.innerHTML='<b>⚠ Fora do percurso</b><small>'+Math.round(n.d)+' m do traçado</small>';
  }
  const next=supportItems.filter(s=>s.km>currentKm+0.2).sort((a,b)=>a.km-b.km)[0];
  if(next){
    document.getElementById('nextName').textContent=next.name;
    document.getElementById('nextInfo').textContent=fmt(next.km-currentKm)+' km à frente · '+next.description;
  }else{
    document.getElementById('nextName').textContent='Fátima';
    document.getElementById('nextInfo').textContent='Chegada ao destino';
  }
  if(typeof course==='number' && course>=0)updateRotation(course);
  else updateRotation(n.heading);
  if(following)map.setView([lat,lon],17,{animate:false});
}
function startGPS(){
  if(!navigator.geolocation){document.getElementById('status').innerHTML='<b>GPS indisponível</b><small>O Android não disponibiliza geolocalização.</small>';return;}
  if(watchId!==null)return;
  navigator.geolocation.getCurrentPosition(
    p=>updatePosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy||20,p.coords.heading),
    e=>{document.getElementById('status').innerHTML='<b>Erro de GPS</b><small>'+e.message+'</small>';},
    {enableHighAccuracy:true,timeout:15000,maximumAge:3000}
  );
  watchId=navigator.geolocation.watchPosition(
    p=>updatePosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy||20,p.coords.heading),
    e=>{document.getElementById('status').innerHTML='<b>Erro de GPS</b><small>'+e.message+'</small>';},
    {enableHighAccuracy:true,maximumAge:3000,timeout:15000}
  );
  document.getElementById('gpsBtn').classList.add('active');
  document.getElementById('startBtn').textContent='⏹ Parar';
  speak('GPS ativado. Navegação iniciada.');
}
function stopGPS(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  document.getElementById('gpsBtn').classList.remove('active');
  document.getElementById('startBtn').textContent='▶ Iniciar';
  document.getElementById('status').innerHTML='<b>GPS desligado</b><small>Ativa o GPS para acompanhar o percurso.</small>';
  speak('GPS desligado.');
}
function simulate(){
  if(!routeCoords.length)return;
  simKm += 2;
  if(simKm>totalKm)simKm=0;
  const p=pointAtKm(simKm);
  updatePosition(p[1],p[0],8,null);
  document.getElementById('nextInfo').textContent=document.getElementById('nextInfo').textContent+' · simulação';
  speak('Quilómetro '+fmt(simKm)+'. '+document.getElementById('nextInfo').textContent);
}
async function init(){
  try{
    const results=await Promise.all([
      fetch(ROUTE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('route.geojson '+r.status);return r.json();}),
      fetch(SUPPORTS,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('apoios-2026.json '+r.status);return r.json();})
    ]);
    routeCoords=results[0].features.map(f=>f.geometry.coordinates);
    supportItems=results[1].items.slice().sort((a,b)=>a.km-b.km);
    totalKm=Number(results[1].route_km||216.1);
    map=L.map('map',{zoomControl:false}).setView([40.2,-8.6],9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,attribution:'© OpenStreetMap contributors'
    }).addTo(map);
    const bounds=[];
    routeCoords.forEach(line=>{
      L.polyline(line.map(p=>[p[1],p[0]]),{color:getComputedStyle(document.documentElement).getPropertyValue('--route').trim()||'#f0c419',weight:5,opacity:.95}).addTo(map);
      line.forEach(p=>bounds.push([p[1],p[0]]));
    });
    if(bounds.length)map.fitBounds(L.latLngBounds(bounds),{padding:[20,20]});
    renderSupports();
    updateStageOptions();

    document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('drawer').classList.toggle('open'));
    document.getElementById('followBtn').addEventListener('click',()=>{
      following=true;
      if(userMarker)map.setView(userMarker.getLatLng(),17,{animate:true});
    });
    document.getElementById('rotateBtn').addEventListener('click',()=>{
      rotateMode=!rotateMode;
      document.getElementById('rotateBtn').classList.toggle('active',rotateMode);
      if(!rotateMode)document.getElementById('mapRot').style.transform='rotate(0deg)';
    });
    document.getElementById('gpsBtn').addEventListener('click',()=>{if(watchId===null)startGPS();else stopGPS();});
    document.getElementById('startBtn').addEventListener('click',()=>{if(watchId===null)startGPS();else stopGPS();});
    document.getElementById('map').addEventListener('click',()=>{following=false;});
    document.getElementById('map').ondblclick=simulate;
  }catch(e){
    console.error(e);
    document.getElementById('status').className='status warn';
    document.getElementById('status').innerHTML='<b>Erro ao carregar</b><small>'+String(e.message||e)+'</small>';
  }
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
