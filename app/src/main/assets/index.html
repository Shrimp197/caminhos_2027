<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caminho do Centenário</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#0e4e37;--green2:#176b4b;--cream:#eef4ef;--route:#f0c419;--blue:#2474db;--danger:#c94136;--text:#173126;--muted:#64776c}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--text)}
.app{height:100%;display:flex;flex-direction:column}.top{height:72px;background:var(--green);color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center}.boot{font-size:29px}.brand b{display:block;font-size:18px;white-space:nowrap}.brand small{display:block;font-size:12px;opacity:.82}.mode{border:1px solid #ffffff55;border-radius:24px;padding:9px 11px;background:transparent;color:#fff;font-weight:800;font-size:12px}
.mode.active{background:#fff;color:var(--green)}
.main{position:relative;flex:1;min-height:0}.maprot{position:absolute;inset:0;transform-origin:50% 50%;pointer-events:none}.maprot #map{pointer-events:auto}.leaflet-container{background:#e6eee8}.leaflet-control-attribution{font-size:9px}
.map{position:absolute;inset:0}.menu{position:absolute;left:10px;top:10px;z-index:1200}.menu button,.fab{border:0;background:#fff;color:var(--green);box-shadow:0 4px 16px #0002}.menu button{width:52px;height:52px;border-radius:17px;font-size:22px}
.fabbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:9px;z-index:1200}.fab{width:52px;height:52px;border-radius:50%;font-size:21px}.fab.active{background:var(--green);color:#fff}
.drawer{display:none;position:absolute;left:10px;right:10px;top:72px;max-height:50vh;overflow:auto;z-index:1250;background:#fff;border-radius:16px;padding:12px;box-shadow:0 8px 28px #0003}.drawer.open{display:block}
.support{padding:8px 0;border-bottom:1px solid #edf0ee}.support b{display:block}.support small{color:var(--muted)}
.panel{position:absolute;left:10px;right:10px;bottom:10px;z-index:1100;background:#fff;border-radius:20px;padding:10px;box-shadow:0 8px 28px #0002}.row{display:flex;gap:8px}.status{flex:1;background:#eef7ef;border-radius:14px;padding:10px 11px;min-width:0}.status.warn{background:#fff0ed;color:#7d231d}.status b{display:block;font-size:16px}.status small{display:block;margin-top:2px;color:var(--muted)}
.start{border:0;border-radius:14px;background:var(--green2);color:#fff;font-size:15px;font-weight:850;padding:0 14px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}.stat{background:#f5f7f5;border-radius:11px;padding:8px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}
.next{margin-top:7px;border:1px solid #dce6df;border-radius:12px;padding:9px 11px}.label{font-size:10px;letter-spacing:.08em;color:var(--muted)}.next b{display:block;font-size:15px;margin:2px 0}.next small{color:var(--muted)}
.voice{display:flex;align-items:center;justify-content:space-between;margin-top:7px;background:#f5f7f5;border-radius:11px;padding:7px 9px;font-size:11px;color:var(--muted)}.voice button{border:0;background:transparent;color:var(--green);font-weight:800}
.stage{margin-top:7px;border-top:1px solid #edf0ee;padding-top:7px}.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stage select{width:100%;padding:8px;border:1px solid #d8e0da;border-radius:9px;background:#fff}.stage small{color:var(--muted)}
.smallrow{display:flex;gap:6px;margin-top:7px}.smallbtn{flex:1;padding:8px 9px;border-radius:10px;border:1px solid #d8e0da;background:#fff;color:var(--green);font-weight:750}
@media(max-width:480px){.top{height:70px}.panel{left:7px;right:7px;bottom:7px}.menu{left:7px}.fabbar{right:7px}.mode{padding:8px 9px}.brand b{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="boot">🥾</span><div><b>Caminho do Centenário</b><small>Gaia → Fátima</small></div></div>
  <button id="modeBtn" class="mode" type="button">MODO CAMINHAR</button>
</header>
<main class="main">
  <div id="mapRot" class="maprot"><div id="map" class="map"></div></div>
  <div class="menu"><button id="menuBtn" aria-label="Apoios">☰</button></div>
  <div class="fabbar">
    <button id="followBtn" class="fab" title="Centrar posição">⌖</button>
    <button id="rotateBtn" class="fab" title="Seguir direção">🧭</button>
    <button id="gpsBtn" class="fab" title="GPS">📍</button>
  </div>
  <div id="drawer" class="drawer">
    <b>⛺ Apoios identificados (2026)</b>
    <div id="supportList"></div>
    <div class="smallrow">
      <button id="testAudioBtn" class="smallbtn">🔊 Testar áudio</button>
      <button id="startHereBtn" class="smallbtn">📍 Iniciar onde estou</button>
    </div>
  </div>
  <section class="panel">
    <div class="row">
      <div id="status" class="status"><b>GPS desligado</b><small>Ativa o GPS ou o modo Caminhar.</small></div>
      <button id="startBtn" class="start">▶ Iniciar</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="kmDone">0,0</b><small>km na etapa</small></div>
      <div class="stat"><b id="kmLeft">216,1</b><small>km até destino</small></div>
      <div class="stat"><b id="offRoute">—</b><small>distância ao traçado</small></div>
    </div>
    <div class="next"><div class="label">PRÓXIMO APOIO</div><b id="nextName">—</b><small id="nextInfo">Define o trecho e inicia.</small></div>
    <div class="voice">🔊 Áudio: <b id="voiceStatus">Imersivo</b><button id="voiceTestInline">Testar</button></div>
    <div class="stage">
      <div class="label">ETAPA / TRECHO</div>
      <div class="stage-grid"><select id="stageStart"></select><select id="stageEnd"></select></div>
      <small id="stageInfo">Seleciona início e fim.</small>
    </div>
  </section>
</main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';

const ROUTE='data/route.geojson', SUPPORTS='data/apoios-2026.json';
let map,routeCoords=[],supportItems=[],markers=[],userMarker=null,accCircle=null,watchId=null;
let following=false,rotateMode=false,walkingMode=false,totalKm=216.1,currentKm=0,simKm=0;
let stageStartKm=0,stageEndKm=216.1,lastStageAnnouncement=false,lastOffRoute=false;
let announcedSupport={},lastProgressBucket=-1,walkStartedAt=0,lastPauseAt=0,lastSpeech='',lastSpeechAt=0,lastSupportArrival=null;

const places=[
['Porto',0],['São João da Madeira',32.1],['Cucujães',36],['Oliveira de Azeméis',41],
['Albergaria-a-Velha',56],['Águeda',74],['Anadia',91],['Mealhada',98.7],
['Coimbra',126.3],['Condeixa-a-Nova',145],['Soure',160],['Pombal',188.2],
['Leiria',201],['Ourém',214.8],['Fátima',216.1]
];

function fmt(n){return Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1})}
function say(text,force){try{const msg=String(text||'').trim(),now=Date.now();if(!msg)return;if(!force&&msg===lastSpeech&&now-lastSpeechAt<15000)return;if(!force&&now-lastSpeechAt<3000)return;lastSpeech=msg;lastSpeechAt=now;if(window.Android&&Android.speak)Android.speak(msg);else if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);u.lang='pt-PT';u.rate=.96;speechSynthesis.speak(u)}}catch(e){}}
function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
function hav(a,b){const R=6371000,p1=a[1]*Math.PI/180,p2=b[1]*Math.PI/180,dp=(b[1]-a[1])*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(Math.max(0,Math.min(1,h))))}
function bearing(a,b){const p1=a[1]*Math.PI/180,p2=b[1]*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(180/Math.PI*Math.atan2(y,x)+360)%360}
function pointSegDistance(p,a,b){const lat=p[1]*Math.PI/180,k=111320,c=Math.cos(lat),ax=a[0]*k*c,ay=a[1]*k,bx=b[0]*k*c,by=b[1]*k,px=p[0]*k*c,py=p[1]*k,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1))),qx=ax+t*dx,qy=ay+t*dy;return{d:Math.hypot(px-qx,py-qy),t}}
function nearest(p){let best={d:Infinity,km:0,heading:0},km=0;for(const line of routeCoords){for(let i=1;i<line.length;i++){const a=line[i-1],b=line[i],r=pointSegDistance(p,a,b),len=hav(a,b)/1000;if(r.d<best.d)best={d:r.d,km:km+len*r.t,heading:bearing(a,b)};km+=len}}return best}
function pointAtKm(target){let km=0;for(const line of routeCoords){for(let i=1;i<line.length;i++){const d=hav(line[i-1],line[i])/1000;if(km+d>=target){const t=(target-km)/(d||1),a=line[i-1],b=line[i];return[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]}km+=d}}const last=routeCoords[routeCoords.length-1];return last[last.length-1]}
function supportText(s){let t=s.description||'apoio';if(s.free)t+='; gratuito';return t}
function renderSupports(){markers.forEach(m=>map.removeLayer(m));markers=[];supportItems.slice().sort((a,b)=>a.km-b.km).forEach(s=>{const m=L.marker([s.lat,s.lon],{icon:icon(s.category)}).addTo(map).bindPopup('<b>'+s.name+'</b><br>'+s.municipality+'<br>'+supportText(s)+'<br><small>Km '+fmt(s.km)+'</small>');markers.push(m)});const list=document.getElementById('supportList');list.innerHTML='';supportItems.slice().sort((a,b)=>a.km-b.km).forEach(s=>{const d=document.createElement('div');d.className='support';d.innerHTML='<b>'+s.name+'</b><small>'+s.municipality+' · km '+fmt(s.km)+'</small>';d.addEventListener('click',()=>{map.setView([s.lat,s.lon],16);document.getElementById('drawer').classList.remove('open')});list.appendChild(d)})}
function icon(kind){const bg=kind==='gratuito'?'#176b4b':'#2474db',s=kind==='gratuito'?'⛺':'ℹ️';return L.divIcon({className:'',html:'<div style="width:27px;height:27px;border-radius:50%;background:'+bg+';border:3px solid #fff;box-shadow:0 2px 7px #0005;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px">'+s+'</div>',iconSize:[27,27],iconAnchor:[13,13]})}
function stageOptions(){const a=document.getElementById('stageStart'),b=document.getElementById('stageEnd');a.innerHTML='';b.innerHTML='';places.forEach(p=>{const o=document.createElement('option');o.value=p[1];o.textContent=p[0]+' · km '+fmt(p[1]);a.appendChild(o);const q=document.createElement('option');q.value=p[1];q.textContent=p[0]+' · km '+fmt(p[1]);b.appendChild(q)});a.value=localStorage.getItem('stageStartKm')||0;b.value=localStorage.getItem('stageEndKm')||216.1;applyStage();a.addEventListener('change',applyStage);b.addEventListener('change',applyStage)}
function applyStage(){const a=Number(document.getElementById('stageStart').value),b=Number(document.getElementById('stageEnd').value);stageStartKm=a;stageEndKm=b;localStorage.setItem('stageStartKm',a);localStorage.setItem('stageEndKm',b);document.getElementById('stageInfo').textContent=b>a?'Trecho selecionado: '+fmt(b-a)+' km':'O fim tem de estar depois do início.';document.getElementById('kmDone').textContent='0,0';document.getElementById('kmLeft').textContent=fmt(Math.max(0,b-a));lastStageAnnouncement=false}
function updateRotation(h){if(rotateMode&&typeof h==='number'&&isFinite(h))document.getElementById('mapRot').style.transform='rotate('+(-h)+'deg)'}
window.setDeviceHeading=function(h){if(rotateMode)updateRotation(Number(h))}
function audioEvents(d,next){
  if(d>=60&&!lastOffRoute){say('Atenção. Está fora do percurso.');vibrate([150,100,150]);lastOffRoute=true}
  else if(d<45&&lastOffRoute){say('Percurso reencontrado.');vibrate(120);lastOffRoute=false}
  if(next){
    const delta=next.km-currentKm;
    [[5,'5 quilómetros'],[2,'2 quilómetros'],[.5,'500 metros']].forEach(t=>{
      const k=next.id+'-'+t[0];
      if(delta<=t[0]&&delta>0&&!announcedSupport[k]){announcedSupport[k]=1;say('Ponto de apoio a '+t[1]+'. '+supportText(next)+'.')}
    });
    if(delta<=.2&&lastSupportArrival!==next.id){lastSupportArrival=next.id;say('Está a chegar ao ponto de apoio '+next.name+'.',true);vibrate([80,70,80])}
  }
  const progress=Math.floor(currentKm/5);
  if(progress>0&&progress>lastProgressBucket&&progress*5<=stageEndKm-stageStartKm){lastProgressBucket=progress;say('Já percorreu '+progress*5+' quilómetros nesta etapa.')}
  if(walkStartedAt&&Date.now()-walkStartedAt>=120*60*1000&&Date.now()-lastPauseAt>=120*60*1000){lastPauseAt=Date.now();say('Já caminha há duas horas. Considere fazer uma pausa.')}
  if(currentKm>=stageEndKm-.08&&!lastStageAnnouncement&&stageEndKm>stageStartKm){lastStageAnnouncement=true;say('Chegou ao destino da etapa.',true);vibrate([200,100,200,100,400])}
}
function updatePosition(lat,lon,acc,course){if(!userMarker)userMarker=L.marker([lat,lon],{zIndexOffset:1000,icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;border-radius:50%;background:#2474db;border:4px solid #fff;box-shadow:0 2px 7px #0005"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);else userMarker.setLatLng([lat,lon]);if(!accCircle)accCircle=L.circle([lat,lon],{radius:acc||20,fillOpacity:.08,weight:1}).addTo(map);else accCircle.setLatLng([lat,lon]).setRadius(acc||20);
  const n=nearest([lon,lat]);currentKm=Math.max(0,Math.min(totalKm,n.km));
  const stageKm=Math.max(0,currentKm-stageStartKm),stageRemaining=Math.max(0,stageEndKm-currentKm);
  document.getElementById('kmDone').textContent=fmt(stageKm);document.getElementById('kmLeft').textContent=fmt(stageRemaining);document.getElementById('offRoute').textContent=fmt(n.d/1000)+' km';
  const st=document.getElementById('status');if(n.d<60){st.className='status';st.innerHTML='<b>✓ No percurso</b><small>'+Math.round(n.d)+' m do traçado</small>'}else{st.className='status warn';st.innerHTML='<b>⚠ Fora do percurso</b><small>'+Math.round(n.d)+' m do traçado</small>'}
  const next=supportItems.filter(s=>s.km>currentKm+.2&&s.km<=stageEndKm+.1).sort((a,b)=>a.km-b.km)[0];
  if(next){document.getElementById('nextName').textContent=next.name;document.getElementById('nextInfo').textContent=fmt(next.km-currentKm)+' km à frente · '+supportText(next)}else{document.getElementById('nextName').textContent='Destino da etapa';document.getElementById('nextInfo').textContent=fmt(Math.max(0,stageEndKm-currentKm))+' km até '+placeName(stageEndKm)}
  audioEvents(n.d,next);if(typeof course==='number'&&course>=0)updateRotation(course);if(following)map.setView([lat,lon],17,{animate:false})
}
function placeName(km){let best=places[0][0],dd=Math.abs(places[0][1]-km);places.forEach(p=>{const d=Math.abs(p[1]-km);if(d<dd){dd=d;best=p[0]}});return best}
function startGPS(){if(!navigator.geolocation){say('O GPS não está disponível neste dispositivo.',true);return}if(watchId!==null)return;navigator.geolocation.getCurrentPosition(p=>updatePosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy||20,p.coords.heading),e=>{document.getElementById('status').innerHTML='<b>Erro de GPS</b><small>'+e.message+'</small>'},{enableHighAccuracy:true,timeout:15000,maximumAge:3000});watchId=navigator.geolocation.watchPosition(p=>updatePosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy||20,p.coords.heading),e=>{document.getElementById('status').innerHTML='<b>Erro de GPS</b><small>'+e.message+'</small>'},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});if(!walkStartedAt)walkStartedAt=Date.now();if(window.Android&&Android.setKeepScreenOn)Android.setKeepScreenOn(true);document.getElementById('gpsBtn').classList.add('active');document.getElementById('startBtn').textContent='⏹ Parar';say('GPS ligado. Acompanhe o traçado do Caminho do Centenário.',true)}
function stopGPS(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(window.Android&&Android.setKeepScreenOn)Android.setKeepScreenOn(false);document.getElementById('gpsBtn').classList.remove('active');document.getElementById('startBtn').textContent='▶ Iniciar';say('GPS desligado.',true)}
function activateWalk(){walkingMode=true;following=true;document.getElementById('modeBtn').classList.add('active');document.getElementById('modeBtn').textContent='CAMINHAR ATIVO';if(!walkStartedAt)walkStartedAt=Date.now();if(window.Android&&Android.setKeepScreenOn)Android.setKeepScreenOn(true);say('Modo Caminhar ativo. Vou acompanhar a sua posição e o percurso.',true);if(watchId===null)startGPS()}
function deactivateWalk(){walkingMode=false;following=false;document.getElementById('modeBtn').classList.remove('active');document.getElementById('modeBtn').textContent='MODO CAMINHAR';say('Modo Caminhar pausado.',true)}
function simulate(){if(!routeCoords.length)return;if(!walkingMode)activateWalk();const min=Math.min(stageStartKm,stageEndKm),max=Math.max(stageStartKm,stageEndKm);simKm=simKm<min?min:simKm+2;if(simKm>max)simKm=min;const p=pointAtKm(simKm);updatePosition(p[1],p[0],8,null);say('Quilómetro '+fmt(Math.max(0,simKm-stageStartKm))+ ' da etapa.',true)}
function startHere(){if(!routeCoords.length||!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{const n=nearest([p.coords.longitude,p.coords.latitude]);const near=n.km;let end=stageEndKm;if(end<=near){end=Math.min(totalKm,near+30)}document.getElementById('stageStart').value=near;stageStartKm=near;document.getElementById('stageEnd').value=end;stageEndKm=end;localStorage.setItem('stageStartKm',near);localStorage.setItem('stageEndKm',end);document.getElementById('stageInfo').textContent='Início aproximado na posição atual: km '+fmt(near);say('Início ajustado para o ponto mais próximo do percurso.',true);activateWalk()},()=>say('Não foi possível obter a localização atual.',true),{enableHighAccuracy:true,timeout:15000,maximumAge:3000})}
async function init(){
  try{
    const [r,s]=await Promise.all([fetch(ROUTE).then(x=>{if(!x.ok)throw Error('Falha ao carregar o percurso');return x.json()}),fetch(SUPPORTS).then(x=>{if(!x.ok)throw Error('Falha ao carregar os apoios');return x.json()})]);
    routeCoords=r.features.map(f=>f.geometry.coordinates);supportItems=s.items.slice().sort((a,b)=>a.km-b.km);totalKm=Number(s.route_km||216.1);
    map=L.map('map',{zoomControl:false}).setView([40.2,-8.6],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
    const bounds=[];routeCoords.forEach(line=>{L.polyline(line.map(p=>[p[1],p[0]]),{color:'#f0c419',weight:5,opacity:.95}).addTo(map);line.forEach(p=>bounds.push([p[1],p[0]]))});if(bounds.length)map.fitBounds(L.latLngBounds(bounds),{padding:[20,20]});
    renderSupports();stageOptions();
    document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('drawer').classList.toggle('open'));
    document.getElementById('modeBtn').addEventListener('click',()=>walkingMode?deactivateWalk():activateWalk());
    document.getElementById('followBtn').addEventListener('click',()=>{following=true;if(userMarker)map.setView(userMarker.getLatLng(),17,{animate:true})});
    document.getElementById('rotateBtn').addEventListener('click',()=>{rotateMode=!rotateMode;document.getElementById('rotateBtn').classList.toggle('active',rotateMode);if(rotateMode){if(window.Android&&Android.startCompass)Android.startCompass();say('Orientação pela direção ativada.',true)}else{if(window.Android&&Android.stopCompass)Android.stopCompass();document.getElementById('mapRot').style.transform='rotate(0deg)';say('Orientação desativada.',true)}});
    document.getElementById('gpsBtn').addEventListener('click',()=>watchId===null?startGPS():stopGPS());
    document.getElementById('startBtn').addEventListener('click',()=>watchId===null?startGPS():stopGPS());
    document.getElementById('testAudioBtn').addEventListener('click',()=>say('Teste de áudio. O Caminho do Centenário está pronto. Ponto de apoio a 5 quilómetros.',true));
    document.getElementById('voiceTestInline').addEventListener('click',()=>say('Áudio imersivo ativo. Vamos avisá-lo sobre percurso, apoios, pausas e destino.',true));
    document.getElementById('startHereBtn').addEventListener('click',startHere);
    document.getElementById('map').addEventListener('dblclick',simulate);
    document.getElementById('map').addEventListener('click',()=>{following=false});
    document.getElementById('status').addEventListener('dblclick',simulate);
  }catch(e){
    console.error(e);document.getElementById('status').className='status warn';document.getElementById('status').innerHTML='<b>Erro ao carregar</b><small>'+String(e.message||e)+'</small>'
  }
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
