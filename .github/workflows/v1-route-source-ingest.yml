name: V1 Route Source Ingestion

on:
  push:
    branches: [ v1-route-import ]

permissions:
  contents: write

jobs:
  ingest-official-route:
    if: ${{ !contains(github.event.head_commit.message, '[route-ingest]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Capture and verify official ACF GPX
        env:
          SOURCE_URL: https://caminhosdefatima.com/wp-content/uploads/2024/10/Caminho_do_centenario.gpx
          EXPECTED_SHA256: 1159c88bc316f0b73257e2c4d89cf3911ddf2191106609de43763a0bf2999266
        run: |
          set -euo pipefail
          mkdir -p data/routes
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_URL" --output data/routes/Caminho_do_centenario.gpx
          test "$(sha256sum data/routes/Caminho_do_centenario.gpx | cut -d' ' -f1)" = "$EXPECTED_SHA256"

      - name: Validate and normalize official route dataset
        run: |
          python3 - <<'PY'
          import hashlib, json, math, xml.etree.ElementTree as ET
          from pathlib import Path

          source = Path('data/routes/Caminho_do_centenario.gpx')
          geo = Path('app/src/main/assets/data/route.geojson')
          manifest_path = Path('data/routes/route-source-manifest.json')
          raw = source.read_bytes()
          expected = '1159c88bc316f0b73257e2c4d89cf3911ddf2191106609de43763a0bf2999266'
          assert hashlib.sha256(raw).hexdigest() == expected
          ns = {'g':'http://www.topografix.com/GPX/1/1'}
          root = ET.fromstring(raw)
          assert len(root.findall('.//g:trk', ns)) == 1
          assert len(root.findall('.//g:trkseg', ns)) == 1
          pts = []
          for p in root.findall('.//g:trkpt', ns):
              lat = float(p.attrib['lat']); lon = float(p.attrib['lon'])
              assert math.isfinite(lat) and math.isfinite(lon)
              assert -90 <= lat <= 90 and -180 <= lon <= 180
              pts.append([lon, lat])
          assert len(pts) == 5082
          assert all(a != b for a,b in zip(pts, pts[1:]))
          R = 6371.0088
          def hav(a,b):
              p1=math.radians(a[1]); p2=math.radians(b[1]); dp=p2-p1; dl=math.radians(b[0]-a[0])
              h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(h))
          length = sum(hav(a,b) for a,b in zip(pts,pts[1:]))
          assert 214.70 < length < 214.90
          payload = {
            'type':'FeatureCollection',
            'name':'Caminho do Centenário',
            'metadata':{
              'route_id':'caminho-do-centenario',
              'official_name':'Caminho do Centenário',
              'source_format':'gpx',
              'source_url':'https://caminhosdefatima.com/wp-content/uploads/2024/10/Caminho_do_centenario.gpx',
              'source_sha256':expected,
              'source_byte_count':len(raw),
              'track_count':1,
              'segment_count':1,
              'point_count':len(pts),
              'geometry_length_km':length,
              'official_published_distance_km':211.87,
              'origin':'Gaia',
              'destination':'Fátima'
            },
            'features':[{'type':'Feature','properties':{'route_id':'caminho-do-centenario','source':'ACF official GPX','source_sha256':expected},'geometry':{'type':'LineString','coordinates':pts}}]
          }
          geo.write_text(json.dumps(payload, ensure_ascii=False, separators=(',',':'))+'\n', encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          gpx = next(x for x in manifest['official_source_files'] if x['format']=='gpx')
          gpx['capture_status'] = 'official_bytes_ingested_and_validated'
          gpx['allowed_for_production'] = True
          gpx['repository_path'] = str(source)
          gpx['normalized_geometry_path'] = str(geo)
          gpx['next_action'] = 'validate stage compatibility before publication'
          manifest['status'] = 'official_gpx_bytes_ingested_validated'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(f'points={len(pts)} geometry_km={length:.6f} first={pts[0]} last={pts[-1]}')
          PY

      - name: Remove legacy WebView data path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
            "const ROUTE='data/route.geojson', SUPPORTS='data/apoios-2026.json'": "const ROUTE='data/route.geojson', SUPPORTS='data/published/webview-supports.json'",
            "const places=[['Porto',0],['São João da Madeira',32.1],['Cucujães',36],['Oliveira de Azeméis',41],['Albergaria-a-Velha',56],['Águeda',74],['Anadia',91],['Mealhada',98.7],['Coimbra',126.3],['Condeixa-a-Nova',145],['Soure',160],['Pombal',188.2],['Leiria',201],['Ourém',214.8],['Fátima',216.1]]": "const places=[['Início do percurso',0],['Fim do percurso',211.87]]",
            "distance:216.099,builtin:true": "distance:211.87,builtin:true",
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected legacy pattern: {old[:80]}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          Path('app/src/main/assets/data/published').mkdir(parents=True,exist_ok=True)
          Path('app/src/main/assets/data/published/webview-supports.json').write_text('{"schema_version":"1.0-published","dataset_id":"caminho_centenario_webview_2027","route_id":"caminho-do-centenario","target_year":2027,"environment":"production","items":[]}\n',encoding='utf-8')
          PY

      - name: Validate repository state
        run: |
          python3 scripts/validate_release.py
          node --check <(sed -n '/<script>/,/<\/script>/p' app/src/main/assets/index.html | sed '1d;$d')

      - name: Commit official ingestion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes/Caminho_do_centenario.gpx app/src/main/assets/data/route.geojson app/src/main/assets/data/published/webview-supports.json app/src/main/assets/index.html data/routes/route-source-manifest.json
          if git diff --cached --quiet; then
            echo 'No ingestion changes required.'
            exit 0
          fi
          git commit -m "Ingest official Centenário route [route-ingest]"
          git push origin HEAD:v1-route-import
