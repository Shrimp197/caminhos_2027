name: Convert hero image to Android-compatible PNG

on:
  push:
    paths:
      - ".github/workflows/convert-hero-image.yml"
      - "app/src/main/assets/data/hero_centenario.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-route-import
          fetch-depth: 0

      - name: Install browser image decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          python3 -m pip install --user Pillow

      - name: Convert hero JPEG to PNG through Chromium
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi build/hero-candidates
          src="$PWD/app/src/main/assets/data/hero_centenario.jpg"
          cat > build/hero-candidates/hero.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><style>
          html,body{margin:0;padding:0;width:480px;height:240px;overflow:hidden;background:#ffffff}
          img{display:block;width:480px;height:240px}
          </style></head><body><img src="file://$src"></body></html>
          HTML
          timeout 30s chromium             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --window-size=480,240             --virtual-time-budget=5000             --screenshot=build/hero-candidates/chromium.png             "file://$PWD/build/hero-candidates/hero.html"
          test -s build/hero-candidates/chromium.png

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          src = Path("build/hero-candidates/chromium.png")
          image = Image.open(src).convert("RGB")
          stat = ImageStat.Stat(image)
          extrema = image.getextrema()
          mean = sum(stat.mean) / 3.0
          spread = sum(hi - lo for lo, hi in extrema) / 3.0
          print(f"chromium hero: {image.size}, mean={mean:.1f}, spread={spread:.1f}, extrema={extrema}")
          if image.size != (480, 240):
              raise SystemExit("Unexpected hero dimensions")
          if mean < 10 or spread < 15 or max(hi for _, hi in extrema) < 30:
              raise SystemExit("Chromium produced a blank or nearly blank hero image")
          target = Path("app/src/main/res/drawable-nodpi/hero_centenario.png")
          target.write_bytes(src.read_bytes())
          print(f"selected Chromium output -> {target}")
          PY
          test -s app/src/main/res/drawable-nodpi/hero_centenario.png

      - name: Commit generated PNG
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f app/src/main/res/drawable-nodpi/hero_centenario.jpg
          git add app/src/main/res/drawable-nodpi/hero_centenario.png
          git diff --cached --quiet && exit 0
          git commit -m "chore(ui): generate Android-compatible hero PNG"
          git push origin HEAD:v1-route-import
