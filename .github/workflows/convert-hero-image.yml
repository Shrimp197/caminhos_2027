name: Convert hero image to Android-compatible PNG

on:
  push:
    paths:
      - ".github/workflows/convert-hero-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-route-import
          fetch-depth: 0

      - name: Convert hero JPEG to PNG
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from PIL import Image
          src = "app/src/main/assets/data/hero_centenario.jpg"
          dst = "app/src/main/res/drawable-nodpi/hero_centenario.png"
          image = Image.open(src).convert("RGB")
          image.save(dst, "PNG", optimize=True)
          print(f"converted {src} -> {dst}: {image.size}")
          PY

      - name: Commit generated PNG
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/hero_centenario.png
          git diff --cached --quiet && exit 0
          git commit -m "chore(ui): generate Android-compatible hero PNG [skip ci]"
          git push origin HEAD:v1-route-import
