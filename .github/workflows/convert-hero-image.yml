name: Convert hero image to Android-compatible PNG

on:
  push:
    paths:
      - ".github/workflows/convert-hero-image.yml"
      - "app/src/main/assets/data/hero_centenario.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-route-import
          fetch-depth: 0

      - name: Install image conversion dependency
        run: python3 -m pip install --user Pillow

      - name: Convert hero JPEG to PNG
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          src="app/src/main/assets/data/hero_centenario.jpg"
          dst="app/src/main/res/drawable-nodpi/hero_centenario.png"
          ffmpeg -y -loglevel warning -err_detect ignore_err -i "$src" -frames:v 1 "$dst"
          test -s "$dst"
          python3 - <<'PY'
          from PIL import Image, ImageStat
          path = "app/src/main/res/drawable-nodpi/hero_centenario.png"
          image = Image.open(path).convert("RGB")
          stat = ImageStat.Stat(image)
          extrema = image.getextrema()
          mean = sum(stat.mean) / 3.0
          spread = sum(hi - lo for lo, hi in extrema) / 3.0
          print(f"converted hero: {image.size}, mean={mean:.1f}, spread={spread:.1f}, extrema={extrema}")
          if mean < 10 or spread < 15 or max(hi for _, hi in extrema) < 30:
              raise SystemExit("Generated hero image is blank or nearly blank")
          PY
              - name: Commit generated PNG
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f app/src/main/res/drawable-nodpi/hero_centenario.jpg
          git add app/src/main/res/drawable-nodpi/hero_centenario.png
          git diff --cached --quiet && exit 0
          git commit -m "chore(ui): generate Android-compatible hero PNG"
          git push origin HEAD:v1-route-import
