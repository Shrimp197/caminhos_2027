name: V1 Route Import Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: v1-route-import-android-smoke
  cancel-in-progress: true

jobs:
  validate-and-build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run route import and geometry tests
        timeout-minutes: 10
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build V1 debug without legacy rewrite scripts
        timeout-minutes: 10
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          shasum -a 256 app/build/outputs/apk/debug/app-debug.apk
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Enable KVM access for Android emulator
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is unavailable on this runner." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          python3 - <<'PY'
          import os
          path = "/dev/kvm"
          if not os.access(path, os.R_OK | os.W_OK):
              raise SystemExit("/dev/kvm is still not readable/writable by the runner user")
          print("/dev/kvm is readable and writable by the runner user.")
          PY

      - name: Set up deterministic AOSP Android emulator
        id: emulator_setup
        timeout-minutes: 12
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          adb start-server
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd --force --name caminhos-aosp34 --package "system-images;android-34;default;x86_64" --device "pixel_2"
          nohup "$EMULATOR" -avd caminhos-aosp34 -no-window -no-audio -no-boot-anim -wipe-data -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 3072 >"$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/emulator.pid"
          python3 - <<'PY'
          import subprocess, time, sys
          deadline = time.time() + 480
          while time.time() < deadline:
              devices = subprocess.run(['adb','devices'], text=True, capture_output=True, timeout=10).stdout
              print(devices, end='')
              if any(line.endswith('\tdevice') and line.startswith('emulator-') for line in devices.splitlines()):
                  boot = subprocess.run(['adb','shell','getprop','sys.boot_completed'], text=True, capture_output=True, timeout=10).stdout.strip()
                  devboot = subprocess.run(['adb','shell','getprop','dev.bootcomplete'], text=True, capture_output=True, timeout=10).stdout.strip()
                  if boot == '1' and devboot == '1':
                      subprocess.run(['adb','shell','cmd','package','list','packages'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30, check=True)
                      print('Android emulator boot completed and package manager is responsive.')
                      sys.exit(0)
              time.sleep(5)
          print('Android emulator failed to reach a completed boot state within 480s.', file=sys.stderr)
          print(subprocess.run(['adb','devices','-l'], text=True, capture_output=True, timeout=10).stdout, file=sys.stderr)
          sys.exit(1)
          PY
      - name: Install V1 debug APK on Android emulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          adb wait-for-device
          adb uninstall com.caminhos2027 >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            echo "Installing V1 debug APK (attempt $attempt/3)"
            if adb install --no-streaming "$APK"; then
              echo "V1 debug APK installed."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "APK installation failed after 3 attempts." >&2
              exit 1
            fi
            echo "APK installation failed; allowing emulator package services to settle before retry."
            sleep 10
            adb shell cmd package bg-dexopt-job >/dev/null 2>&1 || true
          done
          adb shell am force-stop com.caminhos2027
          adb logcat -c
          echo "Instrumentation test will own activity launch."
      - name: Run Android V1 end-to-end tests
        timeout-minutes: 12
        run: gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.caminhos2027.v1.ui.V1EndToEndTest
      - name: Collect visual validation screenshots
        id: visual_screenshots
        if: steps.emulator_setup.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p build/visual-validation
          REMOTE_DIR="/sdcard/Download/caminhos-v1"
          adb shell ls -l "$REMOTE_DIR/caminhos-preparacao.png" "$REMOTE_DIR/caminhos-navegacao.png"
          adb pull "$REMOTE_DIR/caminhos-preparacao.png" build/visual-validation/preparacao.png
          adb pull "$REMOTE_DIR/caminhos-navegacao.png" build/visual-validation/navegacao.png
          test -s build/visual-validation/preparacao.png
          test -s build/visual-validation/navegacao.png
          python3 - <<'PY'
          from pathlib import Path
          import struct

          signature = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          expected = {
              "build/visual-validation/preparacao.png",
              "build/visual-validation/navegacao.png",
          }

          for path_text in expected:
              path = Path(path_text)
              data = path.read_bytes()
              if not data.startswith(signature):
                  raise SystemExit(f"{path} is not a PNG (invalid signature)")
              if len(data) < 24 or data[12:16] != b"IHDR":
                  raise SystemExit(f"{path} is not a valid PNG (missing IHDR)")
              width, height = struct.unpack(">II", data[16:24])
              if width <= 0 or height <= 0:
                  raise SystemExit(f"{path} has invalid dimensions: {width}x{height}")
              print(f"{path}: valid PNG {width}x{height}, {len(data)} bytes")
          PY
      - name: Upload visual validation screenshots
        if: steps.visual_screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-visual-validation
          path: build/visual-validation/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Dump emulator diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          set +e
          adb devices -l
          adb shell getprop sys.boot_completed
          adb shell getprop dev.bootcomplete
          adb shell pidof com.caminhos2027
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
          adb logcat -d -t 1500 2>&1 || true
      - name: Stop Android emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true; fi
          adb kill-server 2>/dev/null || true
      - name: Build unsigned release APK
        timeout-minutes: 10
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          shasum -a 256 app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-debug-validated
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-release-unsigned-validated
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
