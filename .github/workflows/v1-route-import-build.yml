name: V1 Route Import Build

on:
  workflow_dispatch:
  push:
    branches: [ v1-route-import ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run route import and geometry tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build V1 debug without legacy rewrite scripts
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Launch V1 on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.caminhos2027
            adb shell am start -W -n com.caminhos2027/.v1.ui.V1MainActivity
            sleep 5
            dumpsys activity activities | grep -q 'com.caminhos2027/.v1.ui.V1MainActivity'
            if adb shell pidof com.caminhos2027 >/dev/null 2>&1; then
              echo 'V1 application process is running after launch.'
            else
              echo 'V1 application process is not running after launch.'
              adb logcat -d -t 300
              exit 1
            fi

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-debug-validated
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-release-unsigned-validated
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
