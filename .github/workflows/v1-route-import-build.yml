name: V1 Route Import Build

on:
  workflow_dispatch:
  push:
    branches: [ v1-route-import ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run route import and geometry tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build V1 debug without legacy rewrite scripts
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
