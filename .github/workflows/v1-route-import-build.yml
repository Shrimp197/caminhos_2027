name: V1 Route Import Build

on:
  workflow_dispatch:
  push:
    branches: [ v1-route-import ]

concurrency:
  group: v1-route-import-android-smoke
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run route import and geometry tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build V1 debug without legacy rewrite scripts
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Set up Android emulator manually
        timeout-minutes: 10
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          adb start-server
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;arm64-v8a"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd --force --name caminhos-api35 --package "system-images;android-35;google_apis;arm64-v8a" --device "pixel_2"
          nohup "$EMULATOR" -avd caminhos-api35 -no-window -no-audio -no-boot-anim -no-snapshot -no-save -gpu swiftshader_indirect -accel off >"$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/emulator.pid"
          python3 - <<'PY'
          import subprocess, time, sys
          deadline = time.time() + 480
          while time.time() < deadline:
              devices = subprocess.run(['adb','devices'], text=True, capture_output=True, timeout=10).stdout
              print(devices, end='')
              if 'emulator-' in devices and '\tdevice' in devices:
                  boot = subprocess.run(['adb','shell','getprop','sys.boot_completed'], text=True, capture_output=True, timeout=10).stdout.strip()
                  if boot == '1':
                      print('Android emulator boot completed.')
                      sys.exit(0)
              time.sleep(5)
          print('Android emulator failed to reach sys.boot_completed=1 within 480s.', file=sys.stderr)
          try:
              print(subprocess.run(['adb','devices','-l'], text=True, capture_output=True, timeout=10).stdout)
          except Exception:
              pass
          sys.exit(1)
          PY

      - name: Launch V1 on Android emulator
        timeout-minutes: 3
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.caminhos2027
          adb logcat -c
          START_OUTPUT="$(adb shell am start -W -n com.caminhos2027/.v1.ui.V1MainActivity 2>&1)"
          echo "$START_OUTPUT"
          echo "$START_OUTPUT" | grep -q 'Status: ok'
          sleep 5
          RESUMED="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | head -n 1 || true)"
          echo "$RESUMED"
          echo "$RESUMED" | grep -q 'com.caminhos2027/.v1.ui.V1MainActivity'
          adb shell pidof com.caminhos2027

      - name: Dump emulator diagnostics on failure
        if: failure()
        run: |
          set +e
          echo '=== adb devices ==='
          python3 - <<'PY'
          import subprocess
          for cmd in (['adb','devices','-l'], ['adb','shell','getprop','sys.boot_completed'], ['adb','shell','pidof','com.caminhos2027']):
              print('$', ' '.join(cmd))
              try:
                  p = subprocess.run(cmd, text=True, capture_output=True, timeout=15)
                  print(p.stdout)
                  print(p.stderr)
              except Exception as exc:
                  print('diagnostic command failed:', exc)
          PY
          echo '=== emulator log ==='
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
          echo '=== app logcat ==='
          python3 - <<'PY'
          import subprocess
          try:
              p = subprocess.run(['adb','logcat','-d','-t','500'], text=True, capture_output=True, timeout=20)
              print(p.stdout)
              print(p.stderr)
          except Exception as exc:
              print('logcat diagnostic failed:', exc)
          PY

      - name: Stop Android emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
          adb kill-server 2>/dev/null || true

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-debug-validated
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-v1-route-import-release-unsigned-validated
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
