name: V1 Foundation Build

on:
  workflow_dispatch:
  push:
    branches: [ v1-foundation ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run V1 JVM tests without legacy rewrite scripts
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build V1 without legacy rewrite scripts
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V1 foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: caminhos-fatima-v1-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
