name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, "v1.1-complete-audit-fix" ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate application JavaScript and requirements
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)
          if not blocks: raise SystemExit('No inline JavaScript found')
          pathlib.Path('/tmp/index-app.js').write_text('\n'.join(blocks), encoding='utf-8')
          required=[
            'Caminho do Centenário','Caminho do Norte ao Centro','Caminho do Tejo',
            'Caminho da Nazaré','Caminho dos Candeeiros','Rota Carmelita',
            'Rota de Tomar','Rota da Sertã','Rota de Abrantes',
            'Percurso de teste — casa/trabalho','Carregar KML/GPX',
            'pauseTimeCustom','pauseDistanceCustom','timeFmt','supportFilters',
            'Próximos 10 km','Onde dormir?','notifyWatch','startGPS','emergencyBtn'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing expected features: '+', '.join(missing))
          print('HTML/feature structure: OK')
          PY
          node --check /tmp/index-app.js
      - name: Validate bundled data
        shell: bash
        run: |
          test -s app/src/main/assets/data/route.geojson
          test -s app/src/main/assets/data/apoios-2026.json
          test -s app/src/main/assets/data/percurso-teste-casa-trabalho.gpx
          test -s app/src/main/assets/caminho-do-centenario.kml
          python3 - <<'PY'
          import json, pathlib
          json.loads(pathlib.Path('app/src/main/assets/data/route.geojson').read_text())
          d=json.loads(pathlib.Path('app/src/main/assets/data/apoios-2026.json').read_text())
          assert isinstance(d.get('items'), list)
          print('Bundled route/support data: OK')
          PY
      - name: Validate Android integration
        shell: bash
        run: |
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'notifyWatch' app/src/main/java/com/caminhos2027/MainActivity.java
          grep -q 'downloadRoute' app/src/main/java/com/caminhos2027/MainActivity.java
          grep -q 'ACTION_OPEN_DOCUMENT' app/src/main/java/com/caminhos2027/MainActivity.java
          echo 'Android integration: OK'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caminhos-do-Peregrino-v1.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
