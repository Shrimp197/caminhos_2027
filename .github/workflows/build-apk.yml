name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, v1-route-import ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Validate application structure
        run: |
          python3 scripts/validate_release.py
          node --check /tmp/index-app.js
      - name: Run JVM tests
        timeout-minutes: 10
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        timeout-minutes: 10
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          shasum -a 256 app/build/outputs/apk/debug/app-debug.apk
      - name: Set up Android emulator manually
        timeout-minutes: 10
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          adb start-server
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd --force --name caminhos-aosp34 --package "system-images;android-34;default;x86_64" --device "pixel_2"
          nohup "$EMULATOR" -avd caminhos-aosp34 -no-window -no-audio -no-boot-anim -wipe-data -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 3072 >"$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/emulator.pid"
          python3 - <<'PY'
          import subprocess, time, sys
          deadline = time.time() + 480
          while time.time() < deadline:
              devices = subprocess.run(['adb','devices'], text=True, capture_output=True, timeout=10).stdout
              print(devices, end='')
              if any(line.endswith('\tdevice') and line.startswith('emulator-') for line in devices.splitlines()):
                  boot = subprocess.run(['adb','shell','getprop','sys.boot_completed'], text=True, capture_output=True, timeout=10).stdout.strip()
                  devboot = subprocess.run(['adb','shell','getprop','dev.bootcomplete'], text=True, capture_output=True, timeout=10).stdout.strip()
                  if boot == '1' and devboot == '1':
                      print('Android emulator boot completed.')
                      for setting in ('window_animation_scale','transition_animation_scale','animator_duration_scale'):
                          subprocess.run(['adb','shell','settings','put','global',setting,'0'], timeout=10)
                      sys.exit(0)
              time.sleep(5)
          print('Android emulator failed to reach a completed boot state within 480s.', file=sys.stderr)
          sys.exit(1)
          PY
      - name: Launch app on Android emulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.caminhos2027
          adb logcat -c
          adb shell am start -n com.caminhos2027/.v1.ui.V1MainActivity
          for attempt in $(seq 1 36); do
            sleep 5
            RESUMED="$(adb shell dumpsys activity activities 2>/dev/null || true)"
            if echo "$RESUMED" | grep -q 'com.caminhos2027/.v1.ui.V1MainActivity'; then
              PID="$(adb shell pidof com.caminhos2027 2>/dev/null || true)"
              test -n "$PID"
              echo "V1MainActivity resumed; PID=$PID"
              exit 0
            fi
            PID="$(adb shell pidof com.caminhos2027 2>/dev/null || true)"
            if [ -z "$PID" ]; then
              adb logcat -d -t 300 >&2 || true
              exit 1
            fi
          done
          adb shell dumpsys activity activities >&2 || true
          adb logcat -d -t 500 >&2 || true
          exit 1
      - name: Run Android V1 end-to-end tests
        timeout-minutes: 10
        run: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Dump emulator diagnostics on failure
        if: failure()
        run: |
          set +e
          adb devices -l
          adb shell getprop sys.boot_completed
          adb shell getprop dev.bootcomplete
          adb shell pidof com.caminhos2027
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
          adb logcat -d -t 1000 2>&1 || true
      - name: Stop Android emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true; fi
          adb kill-server 2>/dev/null || true
      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Caminhos-do-Peregrino-v1-route-import-debug-validated
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
